services:
  postgres:
    image: postgres:16-alpine
    container_name: contador-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Belem
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contador-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contador-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EDGE_API_KEY: ${EDGE_API_KEY}
    ports:
      - "8081:8080"
    networks:
      - contador-net

volumes:
  postgres_data:

networks:
  contador-net:
    driver: bridge